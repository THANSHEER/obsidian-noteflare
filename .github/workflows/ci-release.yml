name: CI & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Run Unit Tests & Compliance Checks
        run: npm run check

      - name: Run Build (Obsidian check)
        run: npm run build

  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Check for version bump
        id: check
        run: |
          # Read version from Obsidian manifest.json
          VERSION=$(node -p "require('./manifest.json').version")
          echo "Current manifest version: $VERSION"
          
          # Check if tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "Tag ${VERSION} already exists. Skipping release."
            echo "bump=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: ${VERSION}. Triggering release!"
            echo "bump=true" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.bump == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        if: steps.check.outputs.bump == 'true'
        run: npm ci || npm install
        
      - name: Build plugin assets
        if: steps.check.outputs.bump == 'true'
        run: npm run build

      - name: Package Release Zip & Checksum
        if: steps.check.outputs.bump == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          PLUGIN_ID=$(node -p "try { require('./manifest.json').id } catch(e) { '' }")
          if [ -z "$PLUGIN_ID" ]; then
            PLUGIN_ID="noteflare"
          fi
          if [[ "$PLUGIN_ID" != obsidian-* ]]; then
            REPO_PKG_ID="obsidian-${PLUGIN_ID}"
          else
            REPO_PKG_ID="${PLUGIN_ID}"
          fi
          ZIP_NAME="${REPO_PKG_ID}-${VERSION}.zip"
          FILES="main.js manifest.json"
          if [ -f styles.css ]; then
            FILES="$FILES styles.css"
          fi
          zip -j "$ZIP_NAME" $FILES
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          LEGACY_ZIP="${PLUGIN_ID}-${VERSION}.zip"
          if [ "$LEGACY_ZIP" != "$ZIP_NAME" ]; then
            cp "$ZIP_NAME" "$LEGACY_ZIP"
            sha256sum "$LEGACY_ZIP" > "${LEGACY_ZIP}.sha256"
          fi
          cp "$ZIP_NAME" "${PLUGIN_ID}.zip"
          sha256sum "${PLUGIN_ID}.zip" > "${PLUGIN_ID}.zip.sha256"

      - name: Attest Build Provenance (Sigstore)
        if: steps.check.outputs.bump == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            obsidian-noteflare-*.zip
            obsidian-noteflare-*.zip.sha256
            noteflare-*.zip
            noteflare-*.zip.sha256
            noteflare.zip
            noteflare.zip.sha256

      - name: Extract release notes and title from CHANGELOG.md
        if: steps.check.outputs.bump == 'true'
        id: changelog
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found!"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = re.compile(r"^## \[?" + re.escape(version) + r"\]?.*?(?=^## \[?|\Z)", re.M | re.S)
          match = pattern.search(text)
          if not match:
              print(f"No changelog entry found for version {version}", file=sys.stderr)
              sys.exit(1)
          lines = match.group(0).splitlines()
          while lines and lines[-1].strip() in ("", "---"):
              lines.pop()
          # Extract release title from the heading in CHANGELOG.md (e.g. "## [1.2.3] - 2026-09-02" -> "[1.2.3] - 2026-09-02")
          header_line = lines[0] if lines else ""
          title = re.sub(r"^#+\s*", "", header_line).strip()
          if not title:
              title = f"v{version}"
          notes = "\n".join(lines).strip()
          with open("release_notes.txt", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"title={title}\n")
          PY
          {
            echo 'notes<<EOF'
            cat release_notes.txt
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check.outputs.bump == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ steps.changelog.outputs.title }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            main.js
            manifest.json
            styles.css
            obsidian-noteflare-${{ steps.check.outputs.version }}.zip
            obsidian-noteflare-${{ steps.check.outputs.version }}.zip.sha256
            noteflare-${{ steps.check.outputs.version }}.zip
            noteflare-${{ steps.check.outputs.version }}.zip.sha256
            noteflare.zip
            noteflare.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

